name: Compilar mod Quantum Network
on:
  push:
    paths: ['mod/**', '.github/workflows/mod.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }
      - run: gradle build --no-daemon
        working-directory: mod
      - uses: actions/upload-artifact@v4
        with: { name: quantumnet, path: mod/build/libs/*.jar }
      - name: Guardar el jar en el repositorio
        run: |
          mkdir -p servidor/mods_propios
          rm -f servidor/mods_propios/quantumnet-*.jar
          cp mod/build/libs/quantumnet-*.jar servidor/mods_propios/
          rm -f servidor/mods_propios/*-sources.jar
          git config user.name "quantum-ci"
          git config user.email "ci@users.noreply.github.com"
          git add servidor/mods_propios
          git commit -m "CI: jar del mod Quantum Network" || exit 0
          git pull --rebase -q
          git push
